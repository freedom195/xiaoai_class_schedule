services:
  app:
    build: .
    container_name: xiaoai-schedule
    ports:
      - "8011:8011"
    volumes:
      # Persistent storage: SQLite DB, Xiaomi token, log files
      - ./data:/app/data
    environment:
      - DATA_DIR=/app/data
      - TZ=Asia/Shanghai
      # Encryption key for Xiaomi credentials — MUST stay the same across container recreations.
      # Change to your own random string. If lost, saved Xiaomi account/password cannot be decrypted.
      - APP_SECRET=change-this-to-a-random-string
    restart: unless-stopped
